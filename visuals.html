<style>
  .resizable-draggable {
    position: absolute;
    width: 220px;
    height: 124px;
    min-width: 120px;
    min-height: 68px;
    user-select: none;
    z-index: 1;
  }

  .draggable-video {
    width: 100%;
    height: 100%;
    border-radius: 8px;
    object-fit: cover;
  }

  /* Handles for all edges and corners */
  .resize-handle {
    position: absolute;
    z-index: 2;
    pointer-events: auto;
    background: transparent;
  }
  .resize-handle.n { top: -4px; left: 50%; transform: translateX(-50%); width: 24px; height: 8px; cursor: n-resize; }
  .resize-handle.s { bottom: -4px; left: 50%; transform: translateX(-50%); width: 24px; height: 8px; cursor: s-resize; }
  .resize-handle.e { right: -4px; top: 50%; transform: translateY(-50%); width: 8px; height: 24px; cursor: e-resize; }
  .resize-handle.w { left: -4px; top: 50%; transform: translateY(-50%); width: 8px; height: 24px; cursor: w-resize; }
  .resize-handle.nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nw-resize; }
  .resize-handle.ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: ne-resize; }
  .resize-handle.sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: sw-resize; }
  .resize-handle.se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: se-resize; }

  @media (max-width: 800px) {
  .resizable-draggable {
    width: 90vw !important;
    height: 30vw !important;
    min-width: 120px;
    min-height: 68px;
    left: 5vw !important;
    top: auto !important;
    position: relative !important;
    margin-bottom: 16px;
  }
}

</style>

<script>
let zCounter = 10; // Start above header
document.querySelectorAll('.resizable-draggable').forEach(container => {
  let offsetX, offsetY, dragging = false, resizing = false, resizeDir = '', startW, startH, startX, startY, startL, startT;

  // --- DRAGGING ---
  container.addEventListener('mousedown', e => {
    if (e.target.classList.contains('resize-handle')) return;
    dragging = true;
    offsetX = e.clientX - container.offsetLeft;
    offsetY = e.clientY - container.offsetTop;
    zCounter++;
    container.style.zIndex = zCounter;
    document.body.style.cursor = 'grabbing';
  });

  // --- TOUCH DRAGGING ---
  container.addEventListener('touchstart', e => {
    if (e.target.classList.contains('resize-handle')) return;
    const touch = e.touches[0];
    dragging = true;
    offsetX = touch.clientX - container.offsetLeft;
    offsetY = touch.clientY - container.offsetTop;
    zCounter++;
    container.style.zIndex = zCounter;
    document.body.style.cursor = 'grabbing';
    e.preventDefault();
  }, { passive: false });

  // --- RESIZING ---
  container.querySelectorAll('.resize-handle').forEach(handle => {
    handle.addEventListener('mousedown', e => {
      e.stopPropagation();
      resizing = true;
      resizeDir = [...handle.classList].find(cls =>
        ['n','s','e','w','nw','ne','sw','se'].includes(cls)
      );
      startW = container.offsetWidth;
      startH = container.offsetHeight;
      startX = e.clientX;
      startY = e.clientY;
      startL = container.offsetLeft;
      startT = container.offsetTop;
      zCounter++;
      container.style.zIndex = zCounter;
      document.body.style.cursor = handle.style.cursor || window.getComputedStyle(handle).cursor;
    });

    // --- TOUCH RESIZING ---
    handle.addEventListener('touchstart', e => {
      e.stopPropagation();
      const touch = e.touches[0];
      resizing = true;
      resizeDir = [...handle.classList].find(cls =>
        ['n','s','e','w','nw','ne','sw','se'].includes(cls)
      );
      startW = container.offsetWidth;
      startH = container.offsetHeight;
      startX = touch.clientX;
      startY = touch.clientY;
      startL = container.offsetLeft;
      startT = container.offsetTop;
      zCounter++;
      container.style.zIndex = zCounter;
      document.body.style.cursor = handle.style.cursor || window.getComputedStyle(handle).cursor;
      e.preventDefault();
    }, { passive: false });
  });

  // --- MOVE EVENTS ---
  document.addEventListener('mousemove', e => {
    if (dragging) {
      container.style.left = (e.clientX - offsetX) + 'px';
      container.style.top = (e.clientY - offsetY) + 'px';
    }
    if (resizing) {
      let dx = e.clientX - startX;
      let dy = e.clientY - startY;
      let minW = 120, minH = 68;
      let newW = startW, newH = startH, newL = startL, newT = startT;

      if (resizeDir.includes('e')) newW = Math.max(minW, startW + dx);
      if (resizeDir.includes('s')) newH = Math.max(minH, startH + dy);
      if (resizeDir.includes('w')) {
        newW = Math.max(minW, startW - dx);
        newL = startL + dx;
      }
      if (resizeDir.includes('n')) {
        newH = Math.max(minH, startH - dy);
        newT = startT + dy;
      }

      container.style.width = newW + 'px';
      container.style.height = newH + 'px';
      container.style.left = newL + 'px';
      container.style.top = newT + 'px';
    }
  });

  // --- TOUCH MOVE EVENTS ---
  document.addEventListener('touchmove', e => {
    const touch = e.touches[0];
    if (!touch) return;
    if (dragging) {
      container.style.left = (touch.clientX - offsetX) + 'px';
      container.style.top = (touch.clientY - offsetY) + 'px';
    }
    if (resizing) {
      let dx = touch.clientX - startX;
      let dy = touch.clientY - startY;
      let minW = 120, minH = 68;
      let newW = startW, newH = startH, newL = startL, newT = startT;

      if (resizeDir.includes('e')) newW = Math.max(minW, startW + dx);
      if (resizeDir.includes('s')) newH = Math.max(minH, startH + dy);
      if (resizeDir.includes('w')) {
        newW = Math.max(minW, startW - dx);
        newL = startL + dx;
      }
      if (resizeDir.includes('n')) {
        newH = Math.max(minH, startH - dy);
        newT = startT + dy;
      }

      container.style.width = newW + 'px';
      container.style.height = newH + 'px';
      container.style.left = newL + 'px';
      container.style.top = newT + 'px';
    }
    if (dragging || resizing) e.preventDefault();
  }, { passive: false });

  // --- END EVENTS ---
  document.addEventListener('mouseup', () => {
    if (dragging || resizing) {
      dragging = false;
      resizing = false;
      document.body.style.cursor = '';
    }
  });

  document.addEventListener('touchend', () => {
    if (dragging || resizing) {
      dragging = false;
      resizing = false;
      document.body.style.cursor = '';
    }
  });
});

  let pinchResizing = false, pinchStartDist = 0, pinchStartW = 0, pinchStartH = 0;

  container.querySelectorAll('.resize-handle').forEach(handle => {
    handle.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        pinchResizing = true;
        // Get initial pinch distance
        const [touch1, touch2] = e.touches;
        pinchStartDist = Math.hypot(
          touch2.clientX - touch1.clientX,
          touch2.clientY - touch1.clientY
        );
        pinchStartW = container.offsetWidth;
        pinchStartH = container.offsetHeight;
        e.preventDefault();
      }
    }, { passive: false });
  });

  container.addEventListener('touchmove', e => {
    if (pinchResizing && e.touches.length === 2) {
      const [touch1, touch2] = e.touches;
      const pinchDist = Math.hypot(
        touch2.clientX - touch1.clientX,
        touch2.clientY - touch1.clientY
      );
      const scale = pinchDist / pinchStartDist;
      container.style.width = Math.max(120, pinchStartW * scale) + 'px';
      container.style.height = Math.max(68, pinchStartH * scale) + 'px';
      e.preventDefault();
    }
  }, { passive: false });

  container.addEventListener('touchend', e => {
    if (pinchResizing && e.touches.length < 2) {
      pinchResizing = false;
    }
  });
</script>

  document.querySelectorAll('video').forEach(video => {

<script>
document.querySelectorAll('.draggable-video').forEach(video => {
  video.addEventListener('click', () => {
    if (video.paused) {
      video.play();
    } else {
      video.pause();
    }
  });
});
